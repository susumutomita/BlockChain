# 第8章から引き継ぐ3ノードP2P構成（第11章チェックポイント用）
#
# 使い方:
# 1. 起動: docker compose up -d
# 2. ログ確認: docker compose logs -f
# node1がseedブロックを作り、後発のnode3がGET_CHAINで追いついた後、
# node3がgossipブロックを作ります。node3はnode1/node2の両方へ接続するため、
# 重複ブロックが戻ってきても各チェインへ1回だけ追加されることを確認できます。

# 共通設定
x-common-config: &common-config
  volumes:
    - ./:/app
    - ${ZIG_BOOK_CACHE_DIR:-./.book-cache}:/book-cache
  build: .

services:
  node1:
    <<: *common-config
    ports:
      - "3001:3000"
    environment:
      - NODE_ID=1
    command: >-
      sh -c "zig build
      --cache-dir /book-cache/$$NODE_ID/local
      --global-cache-dir /book-cache/global
      --prefix /book-cache/$$NODE_ID/out
      && (sleep 4; printf 'seed\n'; sleep 60)
      | /book-cache/$$NODE_ID/out/bin/evmchapter --listen 3000"

  node2:
    <<: *common-config
    depends_on:
      - node1
    ports:
      - "3002:3000"
    environment:
      - NODE_ID=2
    command: >-
      sh -c "zig build
      --cache-dir /book-cache/$$NODE_ID/local
      --global-cache-dir /book-cache/global
      --prefix /book-cache/$$NODE_ID/out
      && /book-cache/$$NODE_ID/out/bin/evmchapter --listen 3000 --connect node1:3000"

  node3:
    <<: *common-config
    depends_on:
      - node2
    ports:
      - "3003:3000"
    environment:
      - NODE_ID=3
    command: >-
      sh -c "zig build
      --cache-dir /book-cache/$$NODE_ID/local
      --global-cache-dir /book-cache/global
      --prefix /book-cache/$$NODE_ID/out
      && sleep 8
      && (sleep 3; printf 'gossip\n'; sleep 60)
      | /book-cache/$$NODE_ID/out/bin/evmchapter --listen 3000
      --connect node1:3000 --connect node2:3000"
