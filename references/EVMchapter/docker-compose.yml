# Docker Compose構成ファイル - ブロックチェーンノードネットワーク
#
# 使い方:
# 1. node1をビルドして起動: docker compose up --build -d node1
# 2. ログを確認: docker compose logs -f node1

# 共通設定
x-common-config: &common-config
  volumes:
    - ./:/app
  build: .

services:
  node1:
    <<: *common-config
    container_name: node1
    ports:
      - "3001:3000"
    environment:
      - NODE_ID=1
    command: >-
      sh -c "zig build
      --cache-dir /tmp/zig-cache
      --global-cache-dir /tmp/zig-global-cache
      --prefix /tmp/zig-out
      && /tmp/zig-out/bin/evmchapter --listen 3000"

  node2:
    <<: *common-config
    container_name: node2
    ports:
      - "3002:3000"
    environment:
      - NODE_ID=2
    tty: true
    stdin_open: true
    # 長時間実行するコマンドを追加してコンテナを停止させない
    command: sh -c "tail -f /dev/null"

  node3:
    <<: *common-config
    container_name: node3
    ports:
      - "3003:3000"
    environment:
      - NODE_ID=3
    tty: true
    stdin_open: true
    # 長時間実行するコマンドを追加してコンテナを停止させない
    command: sh -c "tail -f /dev/null"
