# Docker Compose構成ファイル - 第9章 EVMu256デモ
#
# 使い方:
#   docker compose run --rm demo

# 共通設定
x-common-config: &common-config
  volumes:
    - ./:/app
  build: .

services:
  demo:
    <<: *common-config
    command: >-
      sh -c "zig build
      --cache-dir /tmp/zig-cache
      --global-cache-dir /tmp/zig-global-cache
      --prefix /tmp/zig-out
      && /tmp/zig-out/bin/chapter9"
